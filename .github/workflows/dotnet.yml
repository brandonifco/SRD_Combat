name: .NET Build and Test

on:
  push:
    branches:
      - main
      - "chore/**"
      - "refactor/**"
      - "feature/**"
      - "fix/**"
      - "test/**"
      - "docs/**"
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    name: build-and-test (${{ matrix.configuration }})

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration ${{ matrix.configuration }} --no-restore

      - name: Test
        run: >-
          dotnet test --configuration ${{ matrix.configuration }} --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.configuration }}
          path: ./TestResults
          retention-days: 14

  vulnerable-packages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # `dotnet list package --vulnerable` always exits 0, so fail the job
      # explicitly when it reports any advisory.
      - name: Check for vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive > vulnerable.txt 2>&1
          cat vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages detected."
            exit 1
          fi
          echo "No vulnerable packages found."
