name: .NET Build and Test

# #485: push used to trigger on every branch prefix (fix/**, feature/**, etc.) as
# well as on pull_request to main. Every branch in this project becomes a PR, and
# every push after that point fired both events — four full [Debug, Release] test
# runs per commit instead of two (measured on PR #470: runs 33009819026 and
# 33009787739, same commit, one push event and one pull_request event).
#
# Chosen fix: restrict `push` to `main` only, and let `pull_request` cover every
# branch once its PR exists. The alternative — a concurrency group keyed to
# collide the push and pull_request runs for the same SHA — was rejected: getting
# that key exactly right (event-dependent, still not double-cancelling itself) is
# subtler than restricting the trigger, and the stated tradeoff is easier to
# reason about later.
#
# Stated tradeoff (acceptance criterion, not an oversight): a branch pushed
# *before* its PR is opened gets no CI until the PR exists. That is a real and
# common sequence here (branch, push, then `gh pr create`) — those early pushes
# are unverified until the PR opens pull_request's first run. Once the PR exists,
# every subsequent push is covered exactly once per configuration.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Dedupe rapid successive pushes to the same PR (or the same main commit) so a
# superseded run stops burning a runner, without ever cancelling a `main` build:
# - pull_request runs group by PR number, so pushing again while a run for that
#   PR is in flight cancels the stale one.
# - push runs (main only, per the trigger restriction above) group by the commit
#   SHA, which is unique per push, and cancel-in-progress is off for push events
#   — so a `main` build is never cancelled by anything, and two different main
#   commits never collide in the same group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    name: build-and-test (${{ matrix.configuration }})

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Validate (${{ matrix.configuration }})
        run: ./scripts/validate.sh ci ${{ matrix.configuration }}

      # Only a failing run needs its trx inspected; a passing one produced an
      # artifact nobody opened. The console logger already carries the summary.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.configuration }}
          path: ./TestResults
          retention-days: 14

      # A later agent reads this through `gh run view --json` instead of re-running
      # the suite to learn what was validated for this commit.
      - name: Publish validation summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.configuration }} — ${{ job.status }}"
            echo
            echo "- commit: \`${{ github.sha }}\`"
            echo "- SDK: \`$(dotnet --version)\` (pinned in global.json)"
            echo "- gate: \`./scripts/validate.sh ci ${{ matrix.configuration }}\` (build at 0 warnings + full test suite)"
          } >> "$GITHUB_STEP_SUMMARY"

  vulnerable-packages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify SDK pin
        run: ./scripts/validate.sh sdk-pin

      - name: Restore
        run: dotnet restore

      # `dotnet list package --vulnerable` always exits 0, so fail the job
      # explicitly when it reports any advisory.
      - name: Check for vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive > vulnerable.txt 2>&1
          cat vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages detected."
            exit 1
          fi
          echo "No vulnerable packages found."
