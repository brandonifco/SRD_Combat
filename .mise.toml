# The toolchain this repository builds with.
#
# This file exists because the development environment drifted four times across three
# machines — snap, apt-only, snap again, and an apt install carrying no .NET 8 SDK at
# all — and every drift was discovered by hand, late. A version pinned in a committed
# file is checkable; a version described in prose is not.
#
# Run `mise install` once per machine, activate mise in your shell
# (`eval "$(mise activate bash)"`, and append it to ~/.bashrc), then `scripts/doctor.sh`
# to confirm. Installing without activating leaves the pin inert: `mise current dotnet`
# reports the pinned version while `dotnet` resolves to whatever is first on PATH.

[tools]
# Pinned to match CI exactly. `.github/workflows` points `setup-dotnet` at this file's
# sibling `global.json` (`global-json-file: global.json`, not a floating `8.0.x`), and
# `Directory.Build.props` targets net8.0 — so building on anything else means the
# compiler and analyzers that gate a merge are not the ones on your desk.
#
# Before #428, CI installed a floating `8.0.x` while this pin and `global.json` named an
# exact patch, so the two could drift apart silently in either direction: #27 was CI
# accepting a collection-expression call that SDK 8.0.129's compiler rejected, and #428
# was the opposite — `main` drifted past the pin while floating CI stayed green.
# Pointing `setup-dotnet` at `global.json` alone did not fix this: with
# `rollForward: latestMajor`, `setup-dotnet` treats "read the pin" as "install the
# newest LTS channel available" (that is what `latestMajor` means to both the action and
# the .NET muxer), and the runner image preinstalls SDKs through .NET 10 — so CI kept
# resolving whatever was newest, silently, even while reading this exact file.
#
# `global.json` now pins 8.0.129 with `rollForward: disable`: no other installed SDK,
# older or newer, satisfies the pin, on the runner or on your desk. The CI workflow also
# runs a "Verify SDK pin" step right after every `setup-dotnet` step that fails the job
# outright if `dotnet --version` differs from `global.json`'s `version` field by even a
# patch — the parity claim is enforced by a CI step now, not asserted in a comment.
#
# NOTE: .NET 8 is LTS through November 2026. When the project moves to .NET 10, this
# line, `global.json`, `Directory.Build.props` and the CI workflow all change together.
dotnet = "8.0.129"

# Godot is deliberately absent, and the reason changed when Phase 7 started. The plan was
# to pin it in the branch that started the client; that branch checked, and the pin is a
# trap: mise's godot (aqua:godotengine/godot) installs the *standard* build — the
# registry's asset templates never select a `_mono_` archive — so the pin would shim a
# Godot that cannot run a C# project ahead of the working .NET one on PATH. Worse than no
# pin. `doctor.sh` reports the Godot actually resolved instead; install the ".NET"
# variant by hand (4.x, `godot --version` should say `mono`).
